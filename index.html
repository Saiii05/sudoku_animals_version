<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="top-bar">
            <div class="logo">
                <h1>Animal Sudoku</h1>
            </div>
            <div class="game-stats">
                <div class="timer">00:00</div>
                <div class="actions">
                    <button id="start-button">Start</button>
                    <button id="end-button" disabled>End</button>
                    <button class="sound-toggle">🔊</button>
                    <button class="hint-button">💡</button>
                    <button class="undo-button">↩️</button>
                    <button class="redo-button">↪️</button>
                    <button id="reset-button">🔄</button>
                </div>
            </div>
        </header>

        <main class="sudoku-board-container">
            <div class="sudoku-grid" id="sudoku-grid">
                <!-- Cells will be generated by JavaScript -->
            </div>
        </main>

        <footer class="animal-palette">
            <!-- Animal icons will be loaded here by JavaScript -->
        </footer>
    </div>

    <script src="app.js" type="module"></script>
</body>
</html>
